<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box{
            height: 700px;
            width: 1000px;
            background-color: brown;
            transition: 2s;
        }
        #box:hover{
            background-color: black;
            border-radius: 50%;
            background-image: linear-gradient(70deg, red, yellow, black);

        }
    </style>
</head>
<body>
    <div id="box"></div>
</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        #parent{
            height: 400px;
            border: 2px solid black;
            display: flex;
             justify-content: center;
             justify-content: space-evenly;
             align-items: center;
             flex-wrap: wrap;
            
        }
            #parent div{
                height: 100px;
                width: 100px;
             }
       
        #one{
            background-color: black;
        }
        #two {
            background-color: yellow;
        }
        #three{
            background-color: green;
        }
        #four{
            background-color: pink;
        }
         
    </style>
</head>
<body>
   <div id="parent">
    <div id="one"></div>
    <div id="two"></div>
    <div id="three"></div>
    <div id="four"></div>
   </div> 
</body>
</html>

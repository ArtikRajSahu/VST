<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        *{
            margin: 0px;
            padding: 0px;
        }
        div{
            height: 100px;
            width: 100px;
            display: inline-block;
        }
        #one{
            background-color: aqua;
            

        }
        #two{
            background-color: blue;
            
            position: static;
            position: relative;
            top: 100px;
            left: 150px;
        }
        #three{
            background-color: brown;
        }
    </style>
</head>
<body>
    <div id="one"></div>
    <div id="two"></div>
    <div id="three"></div>
</body>
</html>
